; Q3RF termosztat -- ESP32 hid (WiFi + BLE + HiveMQ Cloud MQTT)
;   pio run -e esp32dev            (ESP32-WROOM-32 / ESP32-D DevKit)
;   pio run -e esp32c3             (kesobb: ESP32-C3)
;   pio run -e esp32dev -t upload  (feltoltes USB-n)
;   pio device monitor -b 115200   (naplo)

[env]
platform = espressif32
framework = arduino
monitor_speed = 115200
lib_deps =
    h2zero/NimBLE-Arduino @ 1.4.3
    knolleary/PubSubClient @ 2.8
build_flags =
    -DFW_VERSION=\"0.3.0\"
    -DMQTT_MAX_PACKET_SIZE=1536
    ; alap BLE-PIN (az appbol megvaltoztathato)
    -DBLE_DEFAULT_PASSKEY=123456

[env:esp32dev]
board = esp32dev
board_build.partitions = min_spiffs.csv

[env:esp32c3]
board = esp32-c3-devkitm-1
board_build.partitions = min_spiffs.csv
