<svg xmlns="http://www.w3.org/2000/svg" width="860" height="600" viewBox="0 0 860 600" font-family="Segoe UI, Arial, sans-serif">
  <rect x="0" y="0" width="860" height="600" fill="#ffffff"/>
  <text x="430" y="40" text-anchor="middle" font-size="26" font-weight="700" fill="#111827">Q3RF jumper-blokk (3×3 tű) – a két forrasztandó pad</text>
  <text x="430" y="68" text-anchor="middle" font-size="15" fill="#6b7280">A felirat/orientáció a saját paneleden eltérhet – azonosítás a KÖZÖS oszlop és a sor-funkció alapján</text>

  <!-- common column shaded box -->
  <rect x="268" y="120" width="64" height="300" rx="14" fill="#e5e7eb"/>
  <text x="300" y="448" text-anchor="middle" font-size="14" font-weight="700" fill="#374151">KÖZÖS</text>
  <text x="300" y="466" text-anchor="middle" font-size="13" fill="#6b7280">pin 47 / P140</text>
  <text x="300" y="484" text-anchor="middle" font-size="13" fill="#b91c1c" font-weight="700">NE ide!</text>

  <!-- common vertical trace -->
  <line x1="300" y1="160" x2="300" y2="380" stroke="#9ca3af" stroke-width="6"/>
  <!-- row signal traces (middle-right tied) -->
  <line x1="410" y1="160" x2="520" y2="160" stroke="#9ca3af" stroke-width="6"/>
  <line x1="410" y1="270" x2="520" y2="270" stroke="#9ca3af" stroke-width="6"/>
  <line x1="410" y1="380" x2="520" y2="380" stroke="#9ca3af" stroke-width="6"/>

  <!-- pins: 3 cols x 3 rows -->
  <!-- top row (46 / P10) -->
  <circle cx="300" cy="160" r="20" fill="#d1d5db" stroke="#6b7280" stroke-width="3"/>
  <circle cx="410" cy="160" r="20" fill="#d1d5db" stroke="#6b7280" stroke-width="3"/>
  <circle cx="520" cy="160" r="20" fill="#d1d5db" stroke="#6b7280" stroke-width="3"/>
  <!-- middle row (45 / P11) -->
  <circle cx="300" cy="270" r="20" fill="#d1d5db" stroke="#6b7280" stroke-width="3"/>
  <circle cx="410" cy="270" r="20" fill="#bfdbfe" stroke="#6b7280" stroke-width="3"/>
  <circle cx="520" cy="270" r="22" fill="#bfdbfe" stroke="#1d4ed8" stroke-width="6"/>
  <!-- bottom row (44 / P12) -->
  <circle cx="300" cy="380" r="20" fill="#d1d5db" stroke="#6b7280" stroke-width="3"/>
  <circle cx="410" cy="380" r="20" fill="#fed7aa" stroke="#6b7280" stroke-width="3"/>
  <circle cx="520" cy="380" r="22" fill="#fed7aa" stroke="#c2410c" stroke-width="6"/>

  <!-- column captions -->
  <text x="410" y="112" text-anchor="middle" font-size="12" fill="#9ca3af">közép</text>
  <text x="520" y="112" text-anchor="middle" font-size="12" fill="#9ca3af">jobb (jel)</text>

  <!-- row labels (left) -->
  <text x="250" y="150" text-anchor="end" font-size="16" font-weight="700" fill="#374151">HEAT / COOL</text>
  <text x="250" y="170" text-anchor="end" font-size="13" fill="#6b7280">pin46 · P10 · nem kell</text>

  <text x="250" y="262" text-anchor="end" font-size="16" font-weight="700" fill="#1d4ed8">± 0,1 / 0,2</text>
  <text x="250" y="282" text-anchor="end" font-size="13" fill="#1d4ed8">pin45 · P11 · RxD0</text>

  <text x="250" y="372" text-anchor="end" font-size="16" font-weight="700" fill="#c2410c">ROOM / SET</text>
  <text x="250" y="392" text-anchor="end" font-size="13" fill="#c2410c">pin44 · P12 · TxD0</text>

  <!-- target callouts (right) -->
  <line x1="548" y1="270" x2="620" y2="270" stroke="#1d4ed8" stroke-width="3"/>
  <rect x="620" y="244" width="210" height="52" rx="10" fill="#eff6ff" stroke="#1d4ed8" stroke-width="2"/>
  <text x="634" y="266" font-size="15" font-weight="700" fill="#1d4ed8">ESP32 RX ← GPIO16</text>
  <text x="634" y="286" font-size="13" fill="#374151">közvetlen vezeték (nincs ellenállás)</text>

  <line x1="548" y1="380" x2="620" y2="380" stroke="#c2410c" stroke-width="3"/>
  <rect x="620" y="354" width="210" height="52" rx="10" fill="#fff7ed" stroke="#c2410c" stroke-width="2"/>
  <text x="634" y="376" font-size="15" font-weight="700" fill="#c2410c">ESP32 TX → GPIO17</text>
  <text x="634" y="396" font-size="13" fill="#374151">4,7 kΩ-on át erre a padra</text>

  <!-- notes -->
  <text x="40" y="520" font-size="14" fill="#111827" font-weight="700">Mielőtt forrasztasz:</text>
  <text x="40" y="542" font-size="14" fill="#374151">1) Vedd ki MINDKÉT jumper-dugót a blokkról (a KÖZÖS/pin47 ne maradjon rákötve a jelre).</text>
  <text x="40" y="562" font-size="14" fill="#374151">2) A jel a sor jobb (vagy közép) tűjén van – a bal oszlop a közös, oda ne.</text>
  <text x="40" y="582" font-size="14" fill="#374151">3) GND-t külön kösd az ESP32 és a panel közé (pl. elem –, vagy egy gomb másik lába = GND).</text>
</svg>
